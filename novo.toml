[package]
name        = "textwrap-nv"
version     = "0.0.2"
description = "Wrapping, filling and truncating text at a DISPLAY width rather than a character count: the break policy as a named choice, indents that differ on the first line, an ellipsis that fits, and the wrap returning byte offsets so styled text survives it.  The width of a codepoint arrives as a rule the caller supplies, because unicode-nv is not on the registry yet."
license     = "Apache-2.0"

stability   = "draft"

# `core`: text in, text out, and the one thing that is not arithmetic —
# how many columns a codepoint occupies — arrives as an argument.
layer       = "core"

category    = "terminal"

tags        = ["textwrap", "wrap", "fill", "truncate", "word-wrap", "display-width", "terminal", "unicode"]
repository  = "https://github.com/novolang/textwrap-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.9.1"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "Wrapping text at a display width"

[dependencies]
# unicode-nv carries the table this package cannot hold.  The display
# width of a codepoint is UAX #11's East Asian Width property, plus the
# general categories Mn, Me and Cf for the zero-width ones, and that is
# a data table nobody should transcribe twice.  `uwidth.char_width` is
# the `fn(Int) -> Int` a `WrapWidth` holds, so `widths.unicode_width()`
# is one line over it and no signature here is shaped by the
# dependency.
unicode-nv = "^0.1.0"
